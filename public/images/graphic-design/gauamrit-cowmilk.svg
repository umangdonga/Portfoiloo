<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Concrete Texture Simulation -->
    <radialGradient id="concreteLight" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E1DED8"/>
      <stop offset="50%" stop-color="#CCC8C0"/>
      <stop offset="100%" stop-color="#B2ADA5"/>
    </radialGradient>

    <!-- Warm Diagonal Sunlight Filter & Window Slats Shadow -->
    <linearGradient id="slatShadows" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="18" dy="24" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Concrete Slab Surface -->
  <rect width="1000" height="800" fill="url(#concreteLight)"/>

  <!-- Concrete Grain Texture specks -->
  <g opacity="0.12" fill="#5A534B">
    <circle cx="120" cy="180" r="1.5"/><circle cx="340" cy="220" r="2"/><circle cx="560" cy="90" r="1.5"/>
    <circle cx="820" cy="310" r="2.5"/><circle cx="710" cy="650" r="2"/><circle cx="210" cy="710" r="1.8"/>
  </g>

  <!-- Dynamic Diagonal Sunlight & Window Mullion Shadows (Angle Across Canvas) -->
  <g transform="rotate(-32 500 400)" opacity="0.45">
    <rect x="-300" y="-100" width="1600" height="120" fill="black" filter="blur(35px)"/>
    <rect x="-300" y="240" width="1600" height="140" fill="black" filter="blur(38px)"/>
    <rect x="-300" y="580" width="1600" height="160" fill="black" filter="blur(42px)"/>
  </g>

  <!-- CARD 1 (Top Floating Front Card - White with Dripping Milk Wave) -->
  <g transform="translate(420, 240) rotate(-26)" filter="url(#cardShadow)">
    <!-- Base Card Body -->
    <rect x="-220" y="-130" width="440" height="260" rx="4" fill="#FFFFFF"/>

    <!-- Red Dripping Milk Wave at the top of the card -->
    <path d="M-220 -130 L220 -130 L220 -80 
             C200 -80 190 -55 175 -55 C160 -55 155 -90 135 -90
             C115 -90 110 -40 90 -40 C70 -40 65 -85 45 -85
             C25 -85 20 -50 0 -50 C-20 -50 -25 -95 -45 -95
             C-65 -95 -75 -60 -95 -60 C-115 -60 -120 -80 -140 -80
             C-160 -80 -170 -45 -190 -45 C-205 -45 -215 -75 -220 -75 Z" fill="#992222"/>

    <!-- Brand Header "GauAmrit" in vintage red serif font -->
    <text x="-60" y="-10" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#992222">GauAmrit</text>

    <!-- "COW Milk" in Puffy Rounded Retro Lettering in Warm Butter Yellow -->
    <g transform="translate(-10, 50)">
      <text x="-50" y="0" font-family="'Arial Rounded MT Bold', 'Nunito', sans-serif" font-size="52" font-weight="900" fill="#E89B35" letter-spacing="1">COW</text>
      <!-- Milk droplet inside 'O' -->
      <path d="M-5 -26 C-5 -26 3 -12 3 -5 C3 2 -2 6 -6 6 C-10 6 -15 2 -15 -5 C-15 -12 -5 -26 -5 -26 Z" fill="#FFFFFF"/>
      <text x="-15" y="42" font-family="'Arial Rounded MT Bold', 'Nunito', sans-serif" font-size="44" font-weight="900" fill="#E89B35">Milk</text>
    </g>
  </g>

  <!-- CARD 2 (Bottom Angled Back Card - Warm Cream with Kamadhenu Sacred Cow & Umang Donga Details) -->
  <g transform="translate(560, 560) rotate(-26)" filter="url(#cardShadow)">
    <!-- Base Card Body in Warm Cream -->
    <rect x="-220" y="-130" width="440" height="260" rx="4" fill="#F4E6D0"/>

    <!-- Name of Designer / Founder -->
    <text x="-190" y="-95" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1" fill="#111827">UMANG DONGA</text>

    <!-- Mini Brand Top Right -->
    <g transform="translate(130, -100) scale(0.65)">
      <text x="0" y="0" font-family="'Georgia', serif" font-size="18" font-weight="900" fill="#992222">GauAmrit</text>
      <text x="5" y="18" font-family="'Arial Rounded MT Bold', sans-serif" font-size="20" font-weight="900" fill="#E89B35">COW Milk</text>
    </g>

    <!-- Contact Info Row with Red Circle Icons -->
    <g transform="translate(-190, -40)" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#374151">
      <!-- Phone -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="8" fill="#992222"/>
        <path d="M5 5 C5 9 7 11 11 11" stroke="#FFF" stroke-width="1.5" fill="none"/>
        <text x="24" y="12">000 1234 547 897</text>
      </g>
      <!-- Email -->
      <g transform="translate(0, 26)">
        <circle cx="8" cy="8" r="8" fill="#992222"/>
        <rect x="4" y="5" width="8" height="6" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="24" y="12">gauamrit@gmail.com</text>
      </g>
      <!-- Address -->
      <g transform="translate(0, 52)">
        <circle cx="8" cy="8" r="8" fill="#992222"/>
        <circle cx="8" cy="7" r="2.5" fill="#FFF"/>
        <text x="24" y="12">Ahmedabad Gujarat , 382350.</text>
      </g>
      <!-- Website -->
      <g transform="translate(0, 78)">
        <circle cx="8" cy="8" r="8" fill="#992222"/>
        <circle cx="8" cy="8" r="5" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="24" y="12">WWW.gauamrit.com</text>
      </g>
    </g>

    <!-- Detailed Traditional Indian Kamadhenu Cow Art (Bottom Right) -->
    <g transform="translate(130, 45) scale(0.9)">
      <!-- Cow Body (White with soft outlines) -->
      <path d="M-60 20 C-65 0 -40 -15 -10 -15 C25 -15 55 -5 65 20 C70 40 50 65 20 65 C-25 65 -55 50 -60 20 Z" fill="#FFFBF5" stroke="#4A3B32" stroke-width="2"/>
      <!-- Cow Head -->
      <path d="M-60 -5 C-75 -15 -90 -5 -85 15 C-80 30 -65 25 -55 15 Z" fill="#FFFBF5" stroke="#4A3B32" stroke-width="2"/>
      <!-- Ears & Horns -->
      <path d="M-82 -8 C-92 -20 -82 -32 -76 -20" stroke="#4A3B32" stroke-width="2.5" fill="none"/>
      <path d="M-72 -14 C-65 -30 -55 -22 -62 -12" stroke="#4A3B32" stroke-width="2.5" fill="none"/>
      <!-- Red Auspicious Tilak -->
      <circle cx="-75" cy="5" r="3" fill="#D32F2F"/>
      <!-- Ornate Red Embroidered Blanket (Jhool) on Cow Back -->
      <path d="M-25 -5 L35 -5 C40 15 35 35 30 45 L-20 45 C-25 35 -30 15 -25 -5 Z" fill="#A82323" stroke="#F59E0B" stroke-width="2"/>
      <!-- Golden Bells & Jewelry Necklace -->
      <path d="M-60 12 C-55 28 -40 32 -32 25" stroke="#F59E0B" stroke-width="3" fill="none"/>
      <circle cx="-48" cy="30" r="2.5" fill="#D97706"/>
      <circle cx="-40" cy="31" r="2.5" fill="#D97706"/>
      <!-- Legs & Tail -->
      <path d="M-45 60 L-45 75 M-30 62 L-30 75 M30 62 L30 75 M45 60 L45 75" stroke="#4A3B32" stroke-width="3"/>
      <path d="M65 25 C75 35 75 55 70 70" stroke="#4A3B32" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
