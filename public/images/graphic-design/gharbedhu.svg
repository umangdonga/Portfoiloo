<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Clean Canvas -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Logo Mark: Lime Green Shopping Bag on Wheels shaped as 'G' -->
  <g transform="translate(400, 220)">
    <!-- Black Handle -->
    <path d="M-30 -85 C-30 -130 30 -130 30 -85" stroke="#111827" stroke-width="20" stroke-linecap="round" fill="none"/>
    
    <!-- Stylized Green 'G' Bag Body -->
    <path d="M-65 -85 L55 -85 
             C65 -85 75 -75 75 -65 L75 55 
             C75 70 60 82 45 82 L-45 82 
             C-65 82 -75 68 -75 50 L-75 -65 
             C-75 -75 -65 -85 -55 -85 Z" fill="#84CC16"/>

    <!-- Inner 'G' Cutout / Horizontal Shelf -->
    <path d="M-30 -40 L35 -40 L35 0 L-10 0 L-10 40 L35 40 L35 -5 L55 -5 L55 58 L-30 58 Z" fill="#FFFFFF"/>

    <!-- Two Black Rolling Wheels Below -->
    <circle cx="-42" cy="115" r="22" fill="#111827"/>
    <circle cx="36" cy="115" r="22" fill="#111827"/>
  </g>

  <!-- Typography: "Gharbedhu.com" -->
  <g transform="translate(400, 460)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'Ubuntu', 'Inter', sans-serif" font-size="68" font-weight="700" fill="#111827" letter-spacing="-1">
      <tspan font-weight="900">Gharbedhu</tspan><tspan fill="#4B5563">.com</tspan>
    </text>
  </g>
</svg>
